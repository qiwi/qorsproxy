# Runs lint+tests on every push/PR; on master also releases the npm package
# via zx-semrel (with npm OIDC trusted publishing) and pushes the docs to the
# gh-pages branch via ggcp.
name: CI
on: [push, pull_request]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: Test (Node.js 26)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install deps
        run: yarn install --immutable --mode=skip-build

      - name: Test
        run: yarn test

      - name: Upload coverage to Qlty
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        env:
          QLTY_TOKEN: ${{ secrets.QLTY_TOKEN }}
        with:
          token: ${{ env.QLTY_TOKEN }}
          files: coverage/lcov.info

  # Legacy consumers run on Node.js 16: install the package the way they do
  # (npm, fresh resolution, no lockfile) and smoke-test that build.
  legacy:
    name: Smoke (Node.js 16)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 16
          package-manager-cache: false

      - name: Install the package like a consumer
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y
          npm install --no-audit --no-fund "$RUNNER_TEMP"/qiwi-qorsproxy-*.tgz

      - name: Smoke tests
        env:
          QORSPROXY_PKG: ${{ runner.temp }}/consumer/node_modules/@qiwi/qorsproxy
        run: node src/test/smoke/cli.test.js

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push docs to gh-pages
      id-token: write # npm OIDC trusted publishing & provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install deps
        run: yarn install --immutable --mode=skip-build

      - name: Build docs
        run: yarn build

      # Commit, tag, GitHub release and GitHub Packages publish go on behalf of the org bot
      - name: Release npm package
        env:
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GH_USER: ${{ vars.GH_USER }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_OIDC: true
          NPM_PROVENANCE: true
        run: npx --ignore-scripts zx-semrel@^1

      - name: Push docs to gh-pages
        env:
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          npx --ignore-scripts ggcp@^1 'docs>**/*' "https://x-access-token:$GH_PAGES_TOKEN@github.com/$REPO.git/gh-pages" --message='docs: update gh-pages'
